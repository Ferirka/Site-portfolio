<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/questionnaire.css">
    <script src="JS/blogCards.js" defer></script>
    <script src="JS/blogPage.js" defer></script>
    <script src="JS/UpArrow.js" defer></script>
    <title>NIKROXL</title>
</head>

<body>

    <!--                          MAIN                    -->

    <section class="questionnaire">
        <div class="container questionnaire__container">

            <h1 class="questionnaire__title">Анкета</h1>
            <form class="questionnaire__form" action="#" class="questionnaire" method="POST">
                <h3 class="questionnaire__subtitle">1.О проекте</h3>
                <label class="label__heading">1.1.Название проекта / бренда</label>
                <input class="questionnaire__text" type="text" name="project_name" placeholder="Текстовое поле">

                <label class="label__heading">1.2.Чем занимается компания / частное лицо</label>
                <input class="questionnaire__text" type="text" name="industry" placeholder="Текстовое поле">


                <label class="label__heading">1.3.Основная цель сайта?</label>
                <select class="questionnaire__text" name="texts">
                    <option value="yes">Продажи товаров/услуг</option>
                    <option value="partially">Портфолио / презентация работ
                    <option>
                    <option value="no">Информирование / новости</option>
                    <option value="no">Бронирование / запись онлайн</option>
                    <option value="no">Личный бренд / блог, другое</option>
                </select>


                <label class="label__heading">1.4.Какие сайты вам нравятся?<label>
                        <input class="questionnaire__text" size="25" type="text" name="industry"
                            placeholder="2-5 ссылок через запятую">
                        <button class="btn__questionnaire" type="submit">Сохранить данные</button>



                        <h3 class="questionnaire__subtitle">2.Структура и наполнение</h3>
                        <label class="label__heading">2.1.Многостраничный сайт/Лендинг?</label>
                        <select class="questionnaire__text" name="texts">
                            <option value="yes">Многостраничный сайт</option>
                            <option value="partially">Лендинг
                            <option>
                        </select>

                        <label for="checked" class="label__heading">2.2.Какие разделы нужны?</label>
                        <!-- Список чекбоксов -->
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Главная</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Услуги</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Цены</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="portfolio">
                                <span class="form__checkbox-text">Портфолио</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="about">
                                <span class="form__checkbox-text">О нас</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="contacts">
                                <span class="form__checkbox-text">Контакты</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="blog">
                                <span class="form__checkbox-text">Блог</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="catalog">
                                <span class="form__checkbox-text">Каталог</span>
                            </label>
                            <input class="questionnaire__text" size="25" type="text" name="industry"
                                placeholder="Другое">
                        </div>





                        <label class="label__heading">2.3.Сколько блоков нужно на главной странице?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">1</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">2</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">3</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="portfolio">
                                <span class="form__checkbox-text">4</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="about">
                                <span class="form__checkbox-text">5</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="contacts">
                                <span class="form__checkbox-text">6</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="blog">
                                <span class="form__checkbox-text">7</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="catalog">
                                <span class="form__checkbox-text">8</span>
                            </label>
                            <input class="questionnaire__text" size="25" type="text" name="industry"
                                placeholder="Другое">
                        </div>


                        <label class="label__heading">2.4.У вас есть готовые тексты для сайта</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Да всё есть</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Частично, нужно помочь с редактированием</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, нужна полная помощь с текстами</span>
                            </label>

                        </div>

                        <label class="label__heading">2.5.Нужна ли форма обратной связи?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Да, простая (имя, телефон, сообщение)</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Да, расширенная (с выбором услуги, файлами)</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, пока не нужно</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Не знаю, посоветуйте</span>
                            </label>
                        </div>

                        <h3 class="questionnaire__subtitle">3.Дизайн и стиль</h3>

                        <label class="label__heading">3.1. Есть ли у вас логотип?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Да</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Нет</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, нужна помощь с созданием</span>
                            </label>

                        </div>

                        <label class="label__heading">3.2. Есть ли фирменные цвета?</label>
                        <div class="checkbox-group">
                            <input class="questionnaire__text" type="text" name="project_name"
                                placeholder="Да: Текстовое поле">

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Нет, выбираем вместе</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, полагаюсь на ваш вкус</span>
                            </label>

                        </div>

                        <label class="label__heading">3.3. Какой стиль вам ближе?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Строгий / деловой</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Креативный / нестандартный</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Современный / минимализм</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="home">
                                <span class="form__checkbox-text">Классический / консервативный</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Тёмный (dark)</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Светлый (light)</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Не знаю, посоветуйте</span>
                            </label>

                        </div>

                        <label class="label__heading">3.4. Есть ли сайты-примеры, на которые вы хотите
                            ориентироваться?</label>

                        <input class="questionnaire__text" type="text" name="industry" placeholder="Через запятую">
                        <button class="btn__questionnaire" type="submit">Сохранить данные</button>

                        <h3 class="questionnaire__subtitle">4.Функционал и технические детали</h3>

                        <label class="label__heading">4.1. Нужна ли вам админ-панель, чтобы самим редактировать
                            контент?</label>
                        <div class="checkbox-group">

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Да</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Не знаю, посоветуйте</span>
                            </label>

                        </div>

                        <label class="label__heading">4.2. Нужен ли каталог / корзина / онлайн-оплата?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Только каталог (без оплаты)</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Каталог + корзина + оплата</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, не нужно</span>
                            </label>

                        </div>

                        <label class="label__heading">4.3. Есть ли у вас хостинг и домен?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Да, всё есть</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Есть домен, хостинга нет</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Нет, нужна помощь</span>
                            </label>

                        </div>

                        <label class="label__heading">4.4. Какие устройства должны поддерживаться?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">Компьютер</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Планшет</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Телефон</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Все устройства (адаптивный дизайн)</span>
                            </label>

                        </div>

                        <h3 class="questionnaire__subtitle">5.Бюджет и сроки</h3>

                        <label class="label__heading">5.1. Какой бюджет вы рассматриваете на проект?</label>
                        <div class="checkbox-group">
                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                <span class="form__checkbox-text">До 10 000 ₽</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">10 000 – 20 000 ₽</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">20 000 – 40 000 ₽</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Больше 40 000 ₽</span>
                            </label>

                            <label class="form__checkbox-label">
                                <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                <span class="form__checkbox-text">Гибко, обсуждаемо</span>
                            </label>

                            <label class="label__heading">5.2. Какие сроки вас устраивают?</label>
                            <div class="checkbox-group">
                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                    <span class="form__checkbox-text">До 1 недели</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">1–2 недели</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">1 месяц</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Гибко, обсуждаемо</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Есть жёсткий дедлайн</span>
                                </label>

                                <h3 class="questionnaire__subtitle">6. Дополнительно</h3>

                                <label class="label__heading">6.1.  Кто ваши основные конкуренты?</label>
                                <input class="questionnaire__text" type="text" name="project_name"
                                    placeholder="Текстовое поле">

                                    <label class="label__heading">6.2.  Кто ваша целевая аудитория?</label>
                            <div class="checkbox-group">
                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="services">
                                    <span class="form__checkbox-text">Физические лица</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Бизнес (B2B)</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Молодёжь</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Взрослая аудитория</span>
                                </label>

                                <label class="form__checkbox-label">
                                    <input class="form__checkbox" type="checkbox" name="sections[]" value="prices">
                                    <span class="form__checkbox-text">Не знаю, хочу обсудить</span>
                                </label>

                                <label class="label__heading">6.3.  Есть ли что-то, что должно быть на сайте обязательно?</label>
                                <input class="questionnaire__text" type="text" name="project_name"
                                    placeholder="Текстовое поле">

                                    <label class="label__heading">6.3.  Комментарии и пожелания</label>
                                <input class="questionnaire__text" type="text" name="project_name"
                                    placeholder="Текстовое поле">
            </form>
        </div>
    </section>

</body>
</html>
